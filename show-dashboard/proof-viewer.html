<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracemark / Public proof</title>
<style>
:root{--paper:#eeeae1;--ink:#191918;--muted:#69645b;--rule:#b8b0a2;--red:#aa2c21;--green:#176b49;--panel:#f8f5ee}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}main{max-width:1120px;margin:0 auto;padding:44px 34px 70px}.masthead{border-top:5px solid var(--ink);border-bottom:1px solid var(--ink);padding:15px 0 18px;display:flex;justify-content:space-between;gap:20px;align-items:end}.kicker{font:700 11px/1.2 'Arial Narrow',Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}h1{font:700 clamp(34px,6vw,68px)/.95 Georgia,'Times New Roman',serif;letter-spacing:-.045em;margin:8px 0 0}.stamp{font:700 12px 'Arial Narrow',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green);text-align:right}.intro{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;padding:28px 0;border-bottom:1px solid var(--rule)}.intro h2{font:700 28px/1.1 Georgia,'Times New Roman',serif;margin:0 0 10px}.intro p{margin:0;color:var(--muted);max-width:64ch}.meta{border-left:3px solid var(--red);padding-left:16px;color:var(--muted);font-size:13px}.meta b{display:block;color:var(--ink);font:700 11px 'Arial Narrow',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.box{background:var(--panel);border:1px solid var(--rule);padding:22px}.box h3{font:700 12px 'Arial Narrow',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px;color:var(--red)}.value{font:700 22px Georgia,'Times New Roman',serif;word-break:break-word}.small{color:var(--muted);font-size:13px}.digest{font:12px 'Courier New',monospace;word-break:break-all;border-top:1px solid var(--rule);margin-top:16px;padding-top:14px}.match{color:var(--green);font:700 15px 'Arial Narrow',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.actions a{display:inline-block;border:1px solid var(--ink);padding:9px 13px;color:var(--ink);font:700 11px 'Arial Narrow',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}.actions a:hover{background:var(--ink);color:var(--paper)}details{margin-top:24px;border-top:1px solid var(--rule);padding-top:15px}summary{cursor:pointer;font:700 11px 'Arial Narrow',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#e3dfd5;padding:16px;font:12px/1.45 'Courier New',monospace;overflow:auto}.error{color:var(--red)}@media(max-width:760px){main{padding:26px 18px 50px}.masthead,.intro{display:block}.stamp{margin-top:18px;text-align:left}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header class="masthead"><div><div class="kicker">Hedera testnet / Mirror Node</div><h1>Public proof</h1></div><div class="stamp" id="status">Loading record</div></header>
<section class="intro"><div><h2 id="headline">Reading the record...</h2><p id="summary">Fetching the public Mirror Node message.</p></div><div class="meta"><b>Public HCS message</b><span>Decoded fields from one message.</span></div></section>
<section class="grid"><article class="box"><h3>Record</h3><div class="value" id="kind">-</div><p class="small" id="subject">-</p><div class="digest"><b>SHA-256</b><br><span id="digest">-</span></div></article><article class="box"><h3>Hedera receipt</h3><div class="value" id="sequence">-</div><p class="small" id="consensus">-</p><p class="match" id="match">Checking digest...</p><div class="actions"><a id="raw" target="_blank" rel="noreferrer">Open raw Mirror JSON</a><a id="topic" target="_blank" rel="noreferrer">Open topic</a></div></article></section>
<details><summary>Show decoded message</summary><pre id="decoded">-</pre></details>
</main>
<script>
const sequence = new URLSearchParams(location.search).get('sequence');
const mirrorUrl = sequence ? `/mirror/${encodeURIComponent(sequence)}` : '';
const $ = (id) => document.getElementById(id);
$('raw').href = `https://testnet.mirrornode.hedera.com/api/v1/topics/0.0.10426202/messages/${sequence || ''}`;
$('topic').href = 'https://hashscan.io/testnet/topic/0.0.10426202';
const labels = {'SAUCERSWAP PRICE':'SaucerSwap market snapshot','DOCUMENT':'Document record','PAYMENT INTENT':'Payment intent','PAYMENT EXECUTION':'Payment execution'};
(async()=>{try{if(!sequence)throw new Error('No sequence in URL');const response=await fetch(mirrorUrl);if(!response.ok)throw new Error(`Mirror Node returned HTTP ${response.status}`);const body=await response.json();const decoded=JSON.parse(atob(body.message));const expected=new URLSearchParams(location.search).get('digest');const digest=decoded?.hash?.digest||'-';const source=decoded?.metadata?.adapter||decoded?.kind||'HCS record';const matches=Boolean(expected&&digest===expected);$('status').textContent=matches?'PUBLIC RECORD VERIFIED':'PUBLIC RECORD LOADED';$('headline').textContent=labels[source]||source;$('summary').textContent='This record came from Hedera testnet. The raw JSON is one click away.';$('kind').textContent=source;$('subject').textContent=`${decoded?.subject?.type||'subject'}: ${decoded?.subject?.id||'-'}`;$('digest').textContent=digest;$('sequence').textContent=`Sequence ${sequence}`;$('consensus').textContent=`Consensus ${body.consensus_timestamp}`;$('match').textContent=matches?'DIGEST MATCH / VERIFIED':'DIGEST PRESENT / CHECK SOURCE';$('decoded').textContent=JSON.stringify(decoded,null,2)}catch(error){$('status').textContent='COULD NOT LOAD RECORD';$('status').className='stamp error';$('summary').textContent=error.message;$('match').textContent='CHECK FAILED';$('match').className='match error'}})();
</script></body></html>
