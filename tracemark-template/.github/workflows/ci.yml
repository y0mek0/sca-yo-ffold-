name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + typecheck + tests + build + doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd .
          npm ci --no-audit --no-fund

      - name: Lint
        working-directory: .
        run: npm run lint

      - name: Typecheck
        working-directory: .
        run: npm run typecheck

      - name: Tests
        working-directory: .
        run: npm run test

      - name: Build
        working-directory: .
        run: npm run build

      - name: Doctor (demo mode, no env)
        working-directory: .
        run: npm run doctor

      - name: Audit sample
        working-directory: .
        run: npm run audit:sample

      - name: Verify sample (off-chain only)
        working-directory: .
        run: npm run verify:sample
